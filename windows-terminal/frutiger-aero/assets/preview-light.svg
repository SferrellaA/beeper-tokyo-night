<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Frutiger Aero light preview</title>
  <desc id="desc">Illustrated Windows Terminal window using the Frutiger Aero sky palette. This is a drawing, not a screenshot.</desc>
  <defs>
